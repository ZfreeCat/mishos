services:
  mishos:
    image: bljohnsondev/mishos:latest
    container_name: mishos
    ports:
      - 8080:80
    environment:
      - TZ=America/Chicago
      - DB_TYPE=sqlite
      - DB_URL=/db/mishos.db
      - SECRET=YOUR_SECRET_KEY_HERE
      - WATCHLIST_RECENT_LIMIT=30
      - TOKEN_DURATION=90
      # TMDB (required for TMDB watchlist sync + Discover/recommendations)
      - TMDB_API_KEY=YOUR_TMDB_API_KEY_HERE
      # uncomment if you cannot reach api.themoviedb.org directly (mainland China)
      # - TMDB_API_URL=https://api.themoviedb.org/3
      # - TMDB_IMAGE_URL=https://image.tmdb.org/t/p
      # Local image cache
      - IMAGE_CACHE_DIR=/images
      # - CRON_PROVIDER_UPDATE=21 8 * * *
      # - CRON_TMDB_SYNC=0 3 * * *
      # - CRON_IMAGE_PREFETCH=0 4 * * *
      # - RUN_MIGRATION=1
    volumes:
      - /home/brent/temp/mishos:/db
      - /home/brent/temp/mishos-images:/images
    restart: unless-stopped
